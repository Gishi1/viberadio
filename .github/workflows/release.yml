name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            package: ./scripts/release.sh --skip-tests
          - name: windows-x86_64
            os: windows-latest
            package: pwsh -NoProfile -File scripts/package-windows.ps1
          - name: macos-aarch64
            os: macos-latest
            package: ./scripts/package-macos.sh
          - name: macos-x86_64
            os: macos-15-intel
            package: ./scripts/package-macos.sh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The hosted runner's Azure mirror alias can fail to resolve. Point
          # apt at the upstream archive and retry transient failures.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libgl1-mesa-dev patchelf file
      - name: Build and package
        run: ${{ matrix.package }}
        env:
          CARGO_BUILD_JOBS: 2
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: ./scripts/package-appimage.sh
        env:
          CARGO_BUILD_JOBS: 2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz *.zip *.AppImage > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
