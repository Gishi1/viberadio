name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --locked
      # The Windows runner has no audio device and few cores; running tests
      # one at a time keeps device probing and teardown deterministic.
      - name: Run tests (serial)
        if: runner.os == 'Windows'
        run: cargo test --locked -- --test-threads=1
        env:
          RUST_BACKTRACE: "1"
